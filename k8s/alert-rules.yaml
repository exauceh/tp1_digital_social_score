apiVersion: monitoring.googleapis.com/v1
kind: Rules
metadata:
  name: dss-api-slo
  labels:
    app: dss-api
spec:
  # Service level objectives of the scoring API (course n°3, "gestion des alertes").
  # The rules are evaluated by Managed Service for Prometheus. No notification channel is
  # configured here: a firing alert is visible as the ALERTS series in Cloud Monitoring.
  groups:
    - name: dss-api-slo
      interval: 30s
      rules:
        # Share of /score requests answered in less than 300 ms over 5 minutes.
        - record: slo:latency_under_300ms_ratio
          expr: |
            sum(rate(api_latency_seconds_bucket{route="/score", le="0.3"}[5m]))
            /
            sum(rate(api_latency_seconds_count{route="/score"}[5m]))

        - alert: LatencySLOViolated
          expr: slo:latency_under_300ms_ratio < 0.95
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "SLO de latence viole : moins de 95 % des requetes /score repondent en moins de 300 ms"

        - alert: LatencyP95Above500ms
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(api_latency_seconds_bucket{route="/score"}[5m]))) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Latence P95 de /score superieure a 500 ms"

        - alert: ServerErrorRateAbove1Percent
          expr: |
            sum(rate(api_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(api_requests_total[5m])) > 0.01
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Plus de 1 % de reponses 5xx"

        # CPU used by a pod, in cores, as seen by cAdvisor. Each pod requests 1 CPU (deployment.yaml),
        # so 0.9 means 90 % of the request. (The kube_pod_container_resource_requests series does not
        # exist on this cluster, so the request is not read from it: a rule using it never fires.)
        - alert: PodCPUAbove90Percent
          expr: |
            sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="dss", container="api"}[5m])) > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Un pod de l'API utilise plus de 90 % du CPU demande"

        - alert: NoPodAvailable
          expr: kube_deployment_status_replicas_available{namespace="dss", deployment="dss-api"} < 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Aucun pod dss-api disponible"

        # Many refused requests in a row: a client with a wrong or revoked key, or someone guessing keys.
        - alert: AuthenticationFailuresHigh
          expr: sum(rate(api_auth_failures_total[5m])) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Plus d'une requete refusee (cle API invalide) par seconde pendant 5 minutes"
