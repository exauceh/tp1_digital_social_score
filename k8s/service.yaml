apiVersion: v1
kind: Service
metadata:
  name: dss-api
  labels:
    app: dss-api
spec:
  # LoadBalancer (TP n°2, course "attacks between classmates"): a public IP is needed so that
  # classmates can reach /score from outside the cluster. Authentication (X-API-Key) and input
  # validation stay in front of it; nothing else restricts who can connect yet
  # (loadBalancerSourceRanges is not set on purpose, for now). Revert to ClusterIP once the exercise
  # is over: `kubectl patch service dss-api -n dss -p "{\"spec\":{\"type\":\"ClusterIP\"}}"`
  # (or re-apply this file after switching it back), and consider deleting the cluster entirely.
  type: LoadBalancer
  selector:
    app: dss-api
  ports:
    - name: http
      port: 80
      targetPort: http
