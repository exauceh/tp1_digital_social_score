apiVersion: v1
kind: Service
metadata:
  name: dss-api
  labels:
    app: dss-api
  annotations:
    # Used by the HTTPS Ingress (k8s/https.yaml): the load balancer sends traffic straight to the
    # pods (network endpoint groups) and health-checks them on /health (BackendConfig "dss-api").
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "dss-api"}'
spec:
  # ClusterIP: the only public entry point is the HTTPS Ingress (k8s/https.yaml). During the TP2
  # attacks between teams this Service was a plain-HTTP LoadBalancer (34.53.169.140), closed once
  # HTTPS was in place so that no client can bypass TLS.
  type: ClusterIP
  selector:
    app: dss-api
  ports:
    - name: http
      port: 80
      targetPort: http
