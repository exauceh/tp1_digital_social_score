apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dss-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dss-api
  minReplicas: 3   # one more than before: a pod takes 1 to 2.5 minutes to add, longer than a flood lasts
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 40   # percent of the 1 CPU requested by each pod; lower = scales before saturation
