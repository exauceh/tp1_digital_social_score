apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dss-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dss-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60   # percent of the 1 CPU requested by each pod
