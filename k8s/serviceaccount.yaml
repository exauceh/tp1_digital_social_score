apiVersion: v1
kind: ServiceAccount
metadata:
  name: dss-api
  labels:
    app: dss-api
# This identity is the one granted access to Secret Manager through Workload Identity (see
# step_deployment.md): the Google IAM role is attached to this ServiceAccount, nothing else.
# The API does not talk to the Kubernetes API, so no Kubernetes token is mounted in the pod.
automountServiceAccountToken: false
