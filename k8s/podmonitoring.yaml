apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: dss-api
  labels:
    app: dss-api
spec:
  # Google Managed Service for Prometheus (enabled on the cluster) scrapes /metrics of every pod
  # of the API. The metrics are aggregated numbers: no text, no key, no client id.
  selector:
    matchLabels:
      app: dss-api
  endpoints:
    - port: http          # named port of the container (see deployment.yaml)
      path: /metrics
      interval: 15s
      # Matches the METRICS_TOKEN of deployment.yaml: without this, the collector would get 401
      # once that token is set, and Prometheus and Grafana would go blind. Defaults to "Bearer" if
      # the API has no token configured, the collector sends "Authorization: Bearer " (harmless,
      # /metrics ignores it).
      authorization:
        credentials:
          secret:
            name: dss-metrics-token
            key: token
