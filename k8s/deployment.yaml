apiVersion: apps/v1
kind: Deployment
metadata:
  name: dss-api
  labels:
    app: dss-api
spec:
  # Same as the HPA minimum (k8s/hpa.yaml): applying this file must not drop the count below it.
  # Several replicas on purpose: one can fail or be updated while the others keep serving.
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # a new pod must be ready before an old one is removed
      maxSurge: 1
  selector:
    matchLabels:
      app: dss-api
  template:
    metadata:
      labels:
        app: dss-api
    spec:
      # The Google identity of the pod: it can read the API keys secret and nothing else.
      serviceAccountName: dss-api
      # No Kubernetes token in the pod: the API never calls the Kubernetes API, and Workload Identity
      # reaches Google Cloud through the GKE metadata server. Remove this line if Secret Manager
      # authentication fails at start-up and the logs point to missing credentials.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001      # the "appuser" created in the Dockerfile
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Replaced by the real image when the manifests are applied (see step_deployment.md).
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TORCH_NUM_THREADS   # measured: more threads make this small LSTM slower
              value: "2"
            - name: LOG_LEVEL
              value: "INFO"
            # Google Secret Manager secret holding the client_id:sha256 entries (never the keys
            # themselves). The pod reads it at start-up with its Workload Identity; if the secret
            # cannot be read, the pod does not start. During an update the old pods keep serving,
            # so a wrong name or a missing permission cannot take the API down.
            - name: API_KEYS_SECRET
              value: projects/PROJECT_ID_PLACEHOLDER/secrets/dss-api-keys/versions/latest
            # Protects /metrics once the API is reachable from outside the cluster (TP n°2): a
            # separate secret from the API keys above, so it cannot unlock /score. A plain
            # Kubernetes Secret (not Secret Manager): the Managed Prometheus collector that scrapes
            # /metrics reads Kubernetes Secrets directly, see k8s/podmonitoring.yaml.
            # `optional: true` so the deployment still starts if the secret has not been created
            # yet: /metrics is then left open, as documented in security.py.
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dss-metrics-token
                  key: token
                  optional: true
          resources:
            # CPU request drives the autoscaler (hpa.yaml). Memory: about 750 MB measured on Windows
            # with the CUDA build of PyTorch, so this is an upper estimate for the Linux CPU image:
            # check with `kubectl top pods -n dss` and adjust.
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 1536Mi
          # The server only starts listening once spaCy, PyTorch and the model are loaded: the startup
          # probe gives it up to 3 minutes, then the other probes take over.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
