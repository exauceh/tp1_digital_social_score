[project]
name = "tp1-digital-social-score"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "exauceh", email = "houeglaex@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "en-core-web-sm",
    "kagglehub>=1.0.3",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "spacy>=3.8.18",
]

[project.scripts]
tp1-digital-social-score = "tp1_digital_social_score:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "ruff>=0.17.4",
]

[tool.mypy]
strict = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff]
line-length = 100
