[project]
name = "tp1-digital-social-score"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "exauceh", email = "houeglaex@gmail.com" }
]
requires-python = ">=3.14"
# Runtime dependencies of the scoring API (what the Docker image installs).
dependencies = [
    "en-core-web-sm",
    "fastapi>=0.162.2",
    "numpy>=2",
    "pandas>=3.1.1",
    "spacy>=3.8.18",
    "torch>=2.9.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
tp1-digital-social-score = "tp1_digital_social_score:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# `uv sync` keeps installing everything locally; the Docker image uses --no-default-groups.
default-groups = ["dev", "train"]

[tool.uv.sources]
# CUDA build on Windows (the PyPI wheel is CPU only there), small CPU build on Linux (Docker image).
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
# Data download and model training only (notebook): not needed to serve the API.
train = [
    "kagglehub>=1.0.3",
    "laya>=0.4.30",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "transformers>=5.22.2",
]

[tool.mypy]
strict = true

# These libraries ship no type stubs or py.typed marker; strict mode stays on everywhere else.
[[tool.mypy.overrides]]
module = ["sklearn.*", "laya", "laya.*", "kagglehub", "kagglehub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff]
line-length = 100

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
